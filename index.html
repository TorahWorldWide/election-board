<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f2f7">
<title>הפרויקטים שלי עד הבחירות</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#6e6e73;--line:#e5e5ea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Heebo,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
header{max-width:720px;margin:0 auto 18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.count{margin-top:10px;display:flex;align-items:baseline;gap:8px;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.count b{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:16px;color:var(--muted)}
.sum{margin-top:8px;font-size:14px;color:var(--muted)}
.grid{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{position:relative;border:0;text-align:right;color:#fff;border-radius:22px;padding:16px 16px 14px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 6px 18px -8px var(--c);background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 72%,#000));font:inherit;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .no{font-size:13px;opacity:.8;font-weight:600}
.tile .nm{font-size:21px;font-weight:800;line-height:1.15}
.tile .sb{font-size:13.5px;opacity:.88;line-height:1.35}
.tile .ft{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px}
.pill.w{background:rgba(0,0,0,.22)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.nums{font-size:12.5px;opacity:.9;font-variant-numeric:tabular-nums}
/* detail sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#ov.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;z-index:6;padding:0 0 max(24px,env(safe-area-inset-bottom))}
#sheet.show{transform:none;visibility:visible;transition:transform .25s ease}
.sh-top{position:sticky;top:0;color:#fff;padding:18px 18px 16px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 72%,#000))}
.sh-top .nm{font-size:23px;font-weight:800}
.sh-top .sb{font-size:14px;opacity:.9;margin-top:4px}
.sh-top .x{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:20px;line-height:34px;cursor:pointer}
.sec{max-width:720px;margin:14px auto 0;padding:0 14px}
.sec h3{font-size:14px;font-weight:700;color:var(--muted);margin:0 6px 6px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.it{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.4}
.it:first-child{border-top:0}
.mk{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.mk svg{width:13px;height:13px}
.done .mk{background:#34c759;color:#fff}
.todo .mk{border:2px solid #c7c7cc}
.wait .mk{background:#ff9f0a;color:#fff}
.who{display:inline-block;font-size:12.5px;font-weight:700;color:#b25e00;background:#fff2df;border-radius:99px;padding:1px 8px;margin-inline-start:4px}
.empty{padding:12px 14px;color:var(--muted);font-size:14.5px}
.open{display:block;max-width:692px;margin:16px auto 0;text-align:center;text-decoration:none;font-weight:700;color:#fff;background:var(--c);border-radius:14px;padding:13px}
footer{max-width:720px;margin:22px auto 0;text-align:center;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>הפרויקטים שלי עד הבחירות</h1>
  <div class="count"><b id="days">–</b><span id="daysTxt"></span></div>
  <div class="sum" id="sum"></div>
</header>
<main class="grid" id="grid"></main>
<footer id="upd"></footer>
<div id="ov"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<script>
var ICON={done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wait:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v6l4 2"/></svg>',todo:''};
var D=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tot(p){return p.done.length+p.todo.length+p.wait.length}
function countdown(){
  var t=new Date(D.election).getTime(),n=Date.now(),days=Math.ceil((t-n)/864e5);
  var el=document.getElementById('days'),tx=document.getElementById('daysTxt');
  if(days>1){el.textContent=days;tx.textContent='ימים לבחירות · יום שלישי 27.10'}
  else if(days===1){el.textContent='מחר';tx.textContent='הבחירות · 27.10'}
  else{el.textContent='היום';tx.textContent='יום הבחירות. בהצלחה!'}
}
function render(){
  var g='',all=0,dn=0,wt=0;
  D.projects.forEach(function(p,i){
    var T=tot(p),pc=T?Math.round(p.done.length/T*100):0;all+=T;dn+=p.done.length;wt+=p.wait.length;
    var who=p.wait.map(function(w){return w.who}).filter(function(w,j,a){return a.indexOf(w)===j});
    g+='<button class="tile" style="--c:'+p.color+'" data-i="'+i+'">'
      +'<span class="no">פרויקט '+(i+1)+'</span><span class="nm">'+esc(p.name)+'</span><span class="sb">'+esc(p.sub)+'</span>'
      +'<span class="ft"><span class="pill">'+esc(p.status)+'</span>'+(who.length?'<span class="pill w">מחכה ל'+esc(who.join(' ול'))+'</span>':'')+'</span>'
      +'<span class="bar"><i style="width:'+pc+'%"></i></span><span class="nums">'+p.done.length+' נעשו · '+p.todo.length+' נשארו'+(p.wait.length?' · '+p.wait.length+' מחכים':'')+'</span></button>';
  });
  document.getElementById('grid').innerHTML=g;
  document.getElementById('sum').textContent='בכל הפרויקטים ביחד: '+dn+' נעשו מתוך '+all+(wt?' · '+wt+' מחכים לתשובה ממישהו':'');
  var u=new Date(D.updated);document.getElementById('upd').textContent='עודכן: '+u.toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  countdown();
}
function sec(title,cls,items,fmt){
  return '<div class="sec"><h3>'+title+' ('+items.length+')</h3><div class="list">'+(items.length?items.map(function(x){return '<div class="it '+cls+'"><span class="mk">'+ICON[cls]+'</span><span>'+fmt(x)+'</span></div>'}).join(''):'<div class="empty">אין</div>')+'</div></div>';
}
function open(i){
  var p=D.projects[i],s=document.getElementById('sheet');
  s.style.setProperty('--c',p.color);
  s.innerHTML='<div class="sh-top"><button class="x" aria-label="סגור">×</button><div class="nm">'+esc(p.name)+'</div><div class="sb">'+esc(p.sub)+'</div></div>'
    +sec('נשאר לעשות','todo',p.todo,esc)
    +sec('מחכה למישהו','wait',p.wait,function(w){return esc(w.t)+'<span class="who">'+esc(w.who)+'</span>'})
    +sec('עשינו','done',p.done,esc)
    +(p.link?'<a class="open" style="--c:'+p.color+'" href="'+esc(p.link)+'" target="_blank" rel="noopener">לפתוח את האפליקציה</a>':'');
  s.scrollTop=0;s.classList.add('show');document.getElementById('ov').classList.add('show');
  history.pushState({s:1},'');
}
function close(){document.getElementById('sheet').classList.remove('show');document.getElementById('ov').classList.remove('show')}
document.addEventListener('click',function(e){
  var t=e.target.closest('.tile');if(t){open(+t.dataset.i);return}
  if(e.target.closest('.x')||e.target.id==='ov'){if(history.state&&history.state.s)history.back();else close()}
});
window.addEventListener('popstate',close);
fetch('data.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){D=j;render();setInterval(countdown,60000)})
  .catch(function(){document.getElementById('grid').innerHTML='<div class="empty">לא הצלחתי לטעון. רענן את הדף.</div>'});
</script>
</body>
</html>
